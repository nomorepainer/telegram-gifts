<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Gift Roulette</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* TABS */
        .tabs {
            display: flex;
            gap: 0;
            background-color: #0f0f23;
            border-bottom: 1px solid #2a2a4e;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            border-bottom: 2px solid transparent;
        }

        .tab-btn.active {
            color: #ffffff;
            border-bottom-color: #0084ff;
        }

        .tab-content {
            display: none;
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            animation: fadeIn 0.3s;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ROULETTE PAGE */
        .roulette-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .balance {
            text-align: center;
            padding: 15px;
            background-color: #2a2a4e;
            border-radius: 12px;
            width: 100%;
        }

        .balance-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .balance-amount {
            font-size: 32px;
            font-weight: bold;
            color: #ffd60a;
            margin-top: 5px;
        }

        .roulette-wheel {
            width: 280px;
            height: 280px;
            border-radius: 20px;
            background: linear-gradient(135deg, #2a2a4e 0%, #1f1f3a 100%);
            border: 3px solid #0084ff;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 8px;
            padding: 12px;
            box-shadow: 0 0 30px rgba(0, 132, 255, 0.3);
            position: relative;
            transition: transform 0.05s;
        }

        .roulette-wheel.spinning {
            animation: spin 0.08s infinite;
        }

        @keyframes spin {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.05) rotate(2deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .gift-slot {
            background: linear-gradient(135deg, #3a3a5e 0%, #2a2a4e 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #4a4a6e;
            transition: all 0.2s;
            min-height: 80px;
        }

        .gift-slot.center {
            grid-column: 2;
            grid-row: 2;
            border: 3px solid #0084ff;
            box-shadow: 0 0 20px rgba(0, 132, 255, 0.5);
            background: linear-gradient(135deg, #0084ff30 0%, #0084ff15 100%);
        }

        .gift-icon {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }

        .spin-btn {
            background: linear-gradient(135deg, #0084ff 0%, #0066cc 100%);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 132, 255, 0.4);
            width: 100%;
            max-width: 280px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .spin-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 132, 255, 0.6);
        }

        .spin-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .spin-cost {
            font-size: 12px;
            color: #ffd60a;
            margin-top: 8px;
            text-align: center;
        }

        /* CONFETTI */
        .confetti {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
        }

        /* RESULT MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #2a2a4e 0%, #1f1f3a 100%);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid #0084ff;
            max-width: 90%;
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #ffd60a;
        }

        .modal-gift {
            width: 120px;
            height: 120px;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));
        }

        .modal-text {
            font-size: 16px;
            margin: 15px 0;
            color: #ccc;
        }

        .modal-close {
            background: #0084ff;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .modal-close:hover {
            background: #0066cc;
        }

        /* STATS PAGE */
        .stats-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .stat-card {
            background: linear-gradient(135deg, #2a2a4e 0%, #1f1f3a 100%);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #3a3a5e;
        }

        .stat-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #0084ff;
        }

        .wins-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .win-item {
            background: #2a2a4e;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 3px solid #0084ff;
        }

        .win-icon {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
        }

        .win-info {
            flex: 1;
            text-align: left;
        }

        .win-name {
            font-weight: bold;
            color: #ffffff;
        }

        .win-count {
            font-size: 12px;
            color: #ffd60a;
        }

        /* DEMO PAGE */
        .demo-note {
            background: linear-gradient(135deg, #2a2a4e 0%, #1f1f3a 100%);
            padding: 15px;
            border-radius: 12px;
            border-left: 3px solid #ffd60a;
            margin-bottom: 20px;
            font-size: 14px;
            color: #ddd;
        }

        /* PROFILE PAGE */
        .profile-section {
            background: linear-gradient(135deg, #2a2a4e 0%, #1f1f3a 100%);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #3a3a5e;
            text-align: center;
            margin-bottom: 15px;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #0084ff, #00d4ff);
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .profile-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .profile-id {
            font-size: 12px;
            color: #888;
            margin-bottom: 15px;
        }

        .profile-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-mini {
            background: #1f1f3a;
            padding: 12px;
            border-radius: 8px;
        }

        .stat-mini-label {
            font-size: 11px;
            color: #888;
            margin-bottom: 5px;
        }

        .stat-mini-value {
            font-size: 20px;
            font-weight: bold;
            color: #0084ff;
        }

        /* FOOTER */
        .footer {
            padding: 20px;
            text-align: center;
            color: #666;
            font-size: 12px;
            border-top: 1px solid #2a2a4e;
            margin-top: auto;
        }

        .footer a {
            color: #0084ff;
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer a:hover {
            color: #00d4ff;
        }

        /* LOADING */
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #3a3a5e;
            border-top: 3px solid #0084ff;
            border-radius: 50%;
            animation: rotate 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes rotate {
            to { transform: rotate(360deg); }
        }

        /* RESPONSIVE */
        @media (max-width: 480px) {
            .roulette-wheel {
                width: 240px;
                height: 240px;
            }

            .gift-icon {
                width: 50px;
                height: 50px;
            }

            .gift-slot {
                min-height: 70px;
            }

            .balance-amount {
                font-size: 28px;
            }
        }

        /* GLOW EFFECT */
        .glow-highlight {
            animation: glowPulse 0.6s ease-in-out;
        }

        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 132, 255, 0.3); }
            50% { box-shadow: 0 0 40px rgba(0, 132, 255, 0.8), 0 0 60px rgba(255, 214, 10, 0.4); }
        }
    </style>
</head>
