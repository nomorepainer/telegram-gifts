<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рулетка подарков</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: white;
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 80px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 20px 0;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .stars {
            color: #ffd700;
            font-size: 18px;
            font-weight: bold;
        }
        
        .roulette-container {
            background: linear-gradient(180deg, #2a2a4a 0%, #1a1a2e 100%);
            border-radius: 24px;
            padding: 20px 16px 30px 16px;
            margin-bottom: 20px;
            border: 1px solid #3a3a5a;
            position: relative;
            overflow: hidden;
        }
        
        .roulette-title {
            text-align: center;
            font-size: 14px;
            color: #888;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        
        .roulette-wrapper {
            position: relative;
            margin: 0 -8px;
            overflow: hidden;
            border-radius: 16px;
            padding: 10px 0;
            background: rgba(0,0,0,0.3);
        }
        
        .roulette-track {
            display: flex;
            gap: 0;
            transition: none;
            will-change: transform;
            padding: 4px 0;
        }
        
        .prize-item {
            min-width: 80px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 4px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            margin: 0 2px;
            transition: all 0.3s;
            border: 2px solid transparent;
            position: relative;
            height: 120px;
            user-select: none;
        }
        
        .prize-item.active {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.15);
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }
        
        .prize-item .glow {
            position: absolute;
            inset: -2px;
            border-radius: 12px;
            background: radial-gradient(circle at center, rgba(255,215,0,0.2), transparent 70%);
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }
        
        .prize-item.active .glow {
            opacity: 1;
        }
        
        .prize-emoji {
            font-size: 36px;
            margin-bottom: 4px;
            transition: transform 0.3s;
        }
        
        .prize-item.active .prize-emoji {
            transform: scale(1.2);
        }
        
        .prize-name {
            font-size: 10px;
            color: #ccc;
            text-align: center;
            max-width: 70px;
            line-height: 1.2;
        }
        
        .prize-cost {
            font-size: 10px;
            color: #ffd700;
            font-weight: bold;
            margin-top: 2px;
        }
        
        .roulette-pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.6));
        }
        
        .roulette-pointer svg {
            width: 32px;
            height: 32px;
        }
        
        .spin-button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }
        
        .spin-button::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg) translateX(-100%);
            transition: transform 0.6s;
        }
        
        .spin-button:hover::before {
            transform: rotate(45deg) translateX(100%);
        }
        
        .spin-button:active {
            transform: scale(0.95);
        }
        
        .spin-button:disabled {
            opacity: 0.5;
            transform: scale(1);
            cursor: not-allowed;
        }
        
        .spin-button.demo {
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin-top: 10px;
            font-size: 14px;
        }
        
        .result-display {
            text-align: center;
            margin-top: 16px;
            padding: 16px;
            border-radius: 12px;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.2);
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: all 0.5s;
        }
        
        .result-display .big-emoji {
            font-size: 48px;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .result-display .result-text {
            font-size: 16px;
            color: #ffd700;
            margin-top: 4px;
        }
        
        .result-display .result-chance {
            font-size: 12px;
            color: #888;
        }
        
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1a1a2e;
            border-top: 1px solid #2a2a4a;
            display: flex;
            justify-content: space-around;
            padding: 8px 0 12px 0;
            z-index: 100;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: #666;
            font-size: 10px;
            cursor: pointer;
            transition: color 0.3s;
            background: none;
            border: none;
            padding: 4px 16px;
        }
        
        .nav-item.active {
            color: #ffd700;
        }
        
        .nav-item .nav-icon {
            font-size: 22px;
        }
        
        .stats-row {
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid #2a2a4a;
            margin-top: 12px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-item .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: #ffd700;
        }
        
        .stat-item .stat-label {
            font-size: 10px;
            color: #666;
            margin-top: 2px;
        }
        
        .chances-toggle {
            text-align: center;
            padding: 12px;
            color: #667eea;
            cursor: pointer;
            font-size: 13px;
            border-top: 1px solid #2a2a4a;
            margin-top: 12px;
            transition: color 0.3s;
        }
        
        .chances-toggle:hover {
            color: #8b7cf7;
        }
        
        .chances-panel {
            display: none;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            margin-top: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .chances-panel.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(-10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        
        .chance-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            font-size: 12px;
            color: #aaa;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .chance-row .chance-bar {
            flex: 1;
            height: 4px;
            background: #2a2a4a;
            border-radius: 2px;
            margin: 0 8px;
            overflow: hidden;
        }
        
        .chance-row .chance-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 2px;
            transition: width 1s ease;
            width: 0;
        }
        
        .chance-row .chance-bar .fill.animated {
            width: var(--chance-width);
        }
        
        @keyframes confetti {
            0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translateY(-200px) rotate(720deg) scale(0); opacity: 0; }
        }
        
        .confetti-piece {
            position: fixed;
            font-size: 24px;
            animation: confetti 1.5s ease-out forwards;
            pointer-events: none;
            z-index: 999;
        }
        
        .roulette-container.winner {
            border-color: #ffd700;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.2);
            transition: all 0.5s;
        }
        
        .stars.bump {
            animation: bump 0.3s ease;
        }
        
        @keyframes bump {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); color: #ff6b6b; }
        }
        
        ::-webkit-scrollbar {
            width: 4px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <span style="font-size:20px;">🎰</span>
            <span class="stars" id="starsDisplay">⭐ 25</span>
        </div>
    </div>

    <div class="roulette-container" id="rouletteContainer">
        <div class="roulette-title">✦ ВЫ МОЖЕТЕ ВЫИГРАТЬ... ✦</div>
        
        <div class="roulette-wrapper">
            <div class="roulette-pointer">
                <svg viewBox="0 0 32 32">
                    <polygon points="16,28 4,4 28,4" fill="#ffd700" stroke="#fff" stroke-width="1"/>
                    <circle cx="16" cy="10" r="3" fill="#fff" opacity="0.8"/>
                </svg>
            </div>
            <div class="roulette-track" id="rouletteTrack"></div>
        </div>
        
        <button class="spin-button" id="spinBtn">🎰 КРУТИТЬ (25 ⭐)</button>
        <button class="spin-button demo" id="demoBtn">🎮 Демо</button>
        
        <div class="result-display" id="resultDisplay">
            <span style="color:#666;font-size:14px;">Нажмите кнопку</span>
        </div>
        
        <div class="stats-row">
            <div class="stat-item">
                <div class="stat-value" id="totalSpins">0</div>
                <div class="stat-label">Вращений</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="bestWin">-</div>
                <div class="stat-label">Лучший</div>
            </div>
        </div>
        
        <div class="chances-toggle" id="chancesToggle">📊 Шансы</div>
        <div class="chances-panel" id="chancesPanel"></div>
    </div>

    <div class="bottom-nav">
        <button class="nav-item active">
            <span class="nav-icon">🏠</span>
            <span>Главная</span>
        </button>
        <button class="nav-item">
            <span class="nav-icon">🎮</span>
            <span>Игры</span>
        </button>
        <button class="nav-item">
            <span class="nav-icon">🎁</span>
            <span>Лотереи</span>
        </button>
        <button class="nav-item">
            <span class="nav-icon">👤</span>
            <span>Профиль</span>
        </button>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const prizes = [
            { id: 1, name: 'Розовое сердце', emoji: '💗', cost: 15, chance: 35 },
            { id: 2, name: 'Плюшевый мишка', emoji: '🧸', cost: 15, chance: 35 },
            { id: 3, name: 'Коробка с бантом', emoji: '🎁', cost: 25, chance: 12 },
            { id: 4, name: 'Красная роза', emoji: '🌹', cost: 25, chance: 10 },
            { id: 5, name: 'Праздничный торт', emoji: '🎂', cost: 50, chance: 3 },
            { id: 6, name: 'Букет цветов', emoji: '💐', cost: 50, chance: 2.5 },
            { id: 7, name: 'Ракета', emoji: '🚀', cost: 50, chance: 1.5 },
            { id: 8, name: 'Шампанское', emoji: '🍾', cost: 50, chance: 0.5 },
            { id: 9, name: 'Кубок победителя', emoji: '🏆', cost: 100, chance: 0.2 },
            { id: 10, name: 'Кольцо с бриллиантом', emoji: '💍', cost: 100, chance: 0.2 },
            { id: 11, name: 'Большой алмаз', emoji: '💎', cost: 100, chance: 0.1 }
        ];

        let stars = 25;
        let totalSpins = 0;
        let bestWin = null;
        let isSpinning = false;
        let isDemo = false;
        let currentPosition = 0;

        const track = document.getElementById('rouletteTrack');
        const spinBtn = document.getElementById('spinBtn');
        const demoBtn = document.getElementById('demoBtn');
        const resultDisplay = document.getElementById('resultDisplay');
        const totalSpinsEl = document.getElementById('totalSpins');
        const bestWinEl = document.getElementById('bestWin');
        const starsDisplay = document.getElementById('starsDisplay');
        const container = document.getElementById('rouletteContainer');

        function buildRoulette() {
            track.innerHTML = '';
            const repeatCount = 5;
            for (let r = 0; r < repeatCount; r++) {
                prizes.forEach(prize => {
                    const div = document.createElement('div');
                    div.className = 'prize-item';
                    div.dataset.prizeId = prize.id;
                    div.innerHTML = `
                        <div class="glow"></div>
                        <div class="prize-emoji">${prize.emoji}</div>
                        <div class="prize-name">${prize.name}</div>
                        <div class="prize-cost">${prize.cost}⭐</div>
                    `;
                    track.appendChild(div);
                });
            }
        }

        function getRandomPrize() {
            const rand = Math.random() * 100;
            let cumulative = 0;
            for (const prize of prizes) {
                cumulative += prize.chance;
                if (rand <= cumulative) {
                    return prize;
                }
            }
            return prizes[prizes.length - 1];
        }

        function renderChances() {
            const panel = document.getElementById('chancesPanel');
            panel.innerHTML = prizes.map(p => `
                <div class="chance-row">
                    <span>${p.emoji} ${p.name}</span>
                    <div class="chance-bar">
                        <div class="fill" style="--chance-width: ${p.chance}%;"></div>
                    </div>
                    <span>${p.chance}%</span>
                </div>
            `).join('');
            
            setTimeout(() => {
                document.querySelectorAll('.chance-bar .fill').forEach(el => {
                    el.classList.add('animated');
                });
            }, 100);
        }

        function showResult(prize, isWin) {
            resultDisplay.innerHTML = `
                <div class="big-emoji">${prize.emoji}</div>
                <div class="result-text">${isWin ? '🎉 ВЫ ВЫИГРАЛИ!' : ''}</div>
                <div class="result-text" style="font-size:20px;">${prize.name}</div>
                <div class="result-chance">${prize.cost} ⭐</div>
            `;

            if (isWin) {
                container.classList.add('winner');
                createConfetti();
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('heavy');
                }
            } else {
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('light');
                }
            }
        }

        function createConfetti() {
            const emojis = ['🎉', '✨', '⭐', '🎊', '💫', '🌟', '🌈', '🎆'];
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const el = document.createElement('div');
                    el.className = 'confetti-piece';
                    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    el.style.left = (10 + Math.random() * 80) + '%';
                    el.style.top = (10 + Math.random() * 30) + '%';
                    el.style.fontSize = (16 + Math.random() * 24) + 'px';
                    document.body.appendChild(el);
                    setTimeout(() => el.remove(), 1500);
                }, i * 60);
            }
        }

        function updateStars() {
            starsDisplay.textContent = `⭐ ${stars}`;
            starsDisplay.classList.remove('bump');
            void starsDisplay.offsetWidth;
            starsDisplay.classList.add('bump');
        }

        function spin() {
            if (isSpinning) return;
            
            if (!isDemo && stars < 25) {
                resultDisplay.innerHTML = `
                    <div style="color:#ff6b6b;font-size:16px;">❌ Недостаточно звёзд</div>
                    <div style="color:#888;font-size:12px;">Нужно 25 ⭐</div>
                `;
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('error');
                }
                return;
            }

            isSpinning = true;
            spinBtn.disabled = true;
            demoBtn.disabled = true;
            container.classList.remove('winner');

            if (!isDemo) {
                stars -= 25;
                updateStars();
            }

            const prize = getRandomPrize();
            const allItems = track.querySelectorAll('.prize-item');
            const prizeIndex = Array.from(allItems).findIndex(el => parseInt(el.dataset.prizeId) === prize.id);
            
            const totalItems = allItems.length;
            const centerIndex = Math.floor(totalItems / 2);
            const fullRotations = 3 + Math.floor(Math.random() * 3);
            const targetIndex = prizeIndex + (fullRotations * prizes.length);
            
            const itemWidth = 80 + 4;
            const offset = (targetIndex - centerIndex) * itemWidth + 20;
            
            const startPosition = currentPosition;
            const endPosition = startPosition + offset;
            
            track.style.transition = 'transform 4.5s cubic-bezier(0.13, 0.65, 0.25, 1)';
            track.style.transform = `translateX(-${endPosition}px)`;
            
            currentPosition = endPosition;

            allItems.forEach(el => el.classList.remove('active'));

            setTimeout(() => {
                const winningItem = allItems[prizeIndex + (fullRotations * prizes.length)];
                if (winningItem) {
                    winningItem.classList.add('active');
                    winningItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                
                const isWin = prize.cost > 25;
                showResult(prize, isWin);
                
                totalSpins++;
                totalSpinsEl.textContent = totalSpins;
                
                if (!bestWin || prize.cost > bestWin.cost) {
                    bestWin = prize;
                    bestWinEl.textContent = `${prize.emoji} ${prize.cost}⭐`;
                }
                
                isSpinning = false;
                spinBtn.disabled = false;
                demoBtn.disabled = false;
                
                if (!isDemo && stars < 25) {
                    spinBtn.textContent = '😅 Нет звёзд';
                } else {
                    spinBtn.textContent = isDemo ? '🎰 Демо' : `🎰 КРУТИТЬ (25 ⭐)`;
                }
            }, 4700);
        }

        buildRoulette();
        renderChances();

        spinBtn.addEventListener('click', () => {
            isDemo = false;
            spinBtn.textContent = '🎰 КРУТИТЬ (25 ⭐)';
            spin();
        });

        demoBtn.addEventListener('click', () => {
            isDemo = true;
            spinBtn.textContent = '🎰 Демо';
            spin();
        });

        document.getElementById('chancesToggle').addEventListener('click', () => {
            const panel = document.getElementById('chancesPanel');
            panel.classList.toggle('show');
            document.getElementById('chancesToggle').textContent = 
                panel.classList.contains('show') ? '📊 Скрыть' : '📊 Шансы';
        });

        document.querySelectorAll('.nav-item').forEach((item) => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                item.classList.add('active');
            });
        });

        starsDisplay.textContent = `⭐ ${stars}`;
    </script>
</body>
</html>
