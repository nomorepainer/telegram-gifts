<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рулетка</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: white;
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 80px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 20px 0;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .stars {
            color: #ffd700;
            font-size: 18px;
            font-weight: bold;
        }
        .roulette-container {
            background: linear-gradient(180deg, #2a2a4a 0%, #1a1a2e 100%);
            border-radius: 24px;
            padding: 20px 16px 30px 16px;
            border: 1px solid #3a3a5a;
            min-height: 400px;
        }
        .roulette-title {
            text-align: center;
            font-size: 14px;
            color: #888;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .prize-display {
            text-align: center;
            padding: 40px 20px;
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            border: 2px solid #2a2a4a;
            margin-bottom: 20px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .prize-display.winner {
            border-color: #ffd700;
            box-shadow: 0 0 40px rgba(255,215,0,0.2);
        }
        .prize-display .big-emoji {
            font-size: 80px;
            margin-bottom: 10px;
            animation: none;
        }
        .prize-display .big-emoji.spin-anim {
            animation: spinEmoji 0.5s ease;
        }
        @keyframes spinEmoji {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(90deg) scale(1.3); }
            50% { transform: rotate(180deg) scale(0.8); }
            75% { transform: rotate(270deg) scale(1.3); }
            100% { transform: rotate(360deg) scale(1); }
        }
        .prize-display .prize-name {
            font-size: 24px;
            color: #ffd700;
            font-weight: bold;
        }
        .prize-display .prize-cost {
            font-size: 16px;
            color: #888;
            margin-top: 5px;
        }
        .prize-display .prize-chance {
            font-size: 13px;
            color: #666;
            margin-top: 5px;
        }
        .prize-display .placeholder {
            color: #666;
            font-size: 16px;
        }

        .spin-button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            cursor: pointer;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            display: none;
        }
        .spin-button:active {
            transform: scale(0.95);
        }
        .spin-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: scale(1);
        }
        .spin-button.active {
            display: block;
        }
        .spin-button.demo {
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin-top: 10px;
            font-size: 14px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1a1a2e;
            border-top: 1px solid #2a2a4a;
            display: flex;
            justify-content: space-around;
            padding: 8px 0 12px 0;
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: #666;
            font-size: 10px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 4px 16px;
            transition: color 0.3s;
        }
        .nav-item.active {
            color: #ffd700;
        }
        .nav-item .nav-icon {
            font-size: 22px;
        }

        .stats-row {
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid #2a2a4a;
            margin-top: 12px;
        }
        .stat-item {
            text-align: center;
        }
        .stat-item .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: #ffd700;
        }
        .stat-item .stat-label {
            font-size: 10px;
            color: #666;
            margin-top: 2px;
        }

        .chances-toggle {
            text-align: center;
            padding: 12px;
            color: #667eea;
            cursor: pointer;
            font-size: 13px;
            border-top: 1px solid #2a2a4a;
            margin-top: 12px;
        }
        .chances-panel {
            display: none;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            margin-top: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
        .chances-panel.show {
            display: block;
        }
        .chance-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            font-size: 12px;
            color: #aaa;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .chance-row .chance-bar {
            flex: 1;
            height: 4px;
            background: #2a2a4a;
            border-radius: 2px;
            margin: 0 8px;
            overflow: hidden;
        }
        .chance-row .chance-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 2px;
            width: 0;
            transition: width 1s ease;
        }
        .chance-row .chance-bar .fill.animated {
            width: var(--chance-width);
        }

        .stars.bump {
            animation: bump 0.3s ease;
        }
        @keyframes bump {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); color: #ff6b6b; }
        }

        @keyframes confetti {
            0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translateY(-200px) rotate(720deg) scale(0); opacity: 0; }
        }
        .confetti-piece {
            position: fixed;
            font-size: 24px;
            animation: confetti 1.5s ease-out forwards;
            pointer-events: none;
            z-index: 999;
        }

        .footer {
            text-align: center;
            color: #444;
            font-size: 12px;
            margin-top: 20px;
            padding: 10px;
            border-top: 1px solid #2a2a4a;
        }
        .footer a {
            color: #667eea;
            text-decoration: none;
        }
        .footer a:hover {
            color: #8b7cf7;
        }

        .page {
            display: none;
        }
        .page.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <span style="font-size:20px;">🎰</span>
            <span class="stars" id="starsDisplay">⭐ 25</span>
        </div>
    </div>

    <!-- СТРАНИЦА: КРУТКА -->
    <div class="page active" id="pageSpin">
        <div class="roulette-container" id="rouletteContainer">
            <div class="roulette-title">✦ ВЫ МОЖЕТЕ ВЫИГРАТЬ... ✦</div>

            <div class="prize-display" id="prizeDisplay">
                <div class="placeholder">🎯 Нажмите кнопку</div>
            </div>

            <button class="spin-button active" id="spinBtn">🎰 КРУТИТЬ (25 ⭐)</button>

            <div class="stats-row">
                <div class="stat-item">
                    <div class="stat-value" id="totalSpins">0</div>
                    <div class="stat-label">Вращений</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="bestWin">-</div>
                    <div class="stat-label">Лучший</div>
                </div>
            </div>

            <div class="chances-toggle" id="chancesToggle">📊 Шансы</div>
            <div class="chances-panel" id="chancesPanel"></div>
        </div>
    </div>

    <!-- СТРАНИЦА: ДЕМО КРУТКА -->
    <div class="page" id="pageDemo">
        <div class="roulette-container" id="rouletteContainerDemo">
            <div class="roulette-title">✦ ДЕМО-РЕЖИМ ✦</div>

            <div class="prize-display" id="prizeDisplayDemo">
                <div class="placeholder">🎯 Нажмите кнопку</div>
            </div>

            <button class="spin-button active demo" id="demoBtn">🎮 ДЕМО КРУТКА</button>

            <div style="text-align:center;color:#666;font-size:13px;margin-top:16px;padding:12px;border-top:1px solid #2a2a4a;">
                ⚡ Бесплатно. Звёзды не тратятся
            </div>
        </div>
    </div>

    <!-- СТРАНИЦА: ПРОФИЛЬ -->
    <div class="page" id="pageProfile">
        <div class="roulette-container" style="min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;">
            <div style="font-size:60px;margin-bottom:16px;">👤</div>
            <div style="font-size:20px;color:#ffd700;font-weight:bold;">Профиль</div>
            <div style="color:#888;font-size:14px;margin-top:8px;">Статистика игрока</div>
            <div class="stats-row" style="width:100%;border-top:1px solid #2a2a4a;margin-top:20px;">
                <div class="stat-item">
                    <div class="stat-value" id="profileSpins">0</div>
                    <div class="stat-label">Всего вращений</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="profileBest">-</div>
                    <div class="stat-label">Лучший выигрыш</div>
                </div>
            </div>
            <div style="color:#444;font-size:12px;margin-top:20px;border-top:1px solid #2a2a4a;padding-top:20px;width:100%;text-align:center;">
                ⭐ Звёзд: <span id="profileStars">25</span>
            </div>
        </div>
    </div>

    <!-- НАВИГАЦИЯ -->
    <div class="bottom-nav">
        <button class="nav-item active" data-page="pageSpin">
            <span class="nav-icon">🎰</span>
            <span>Крутка</span>
        </button>
        <button class="nav-item" data-page="pageDemo">
            <span class="nav-icon">🎮</span>
            <span>Демо</span>
        </button>
        <button class="nav-item" data-page="pageProfile">
            <span class="nav-icon">👤</span>
            <span>Профиль</span>
        </button>
    </div>

    <div class="footer">
        <a href="https://t.me/DurovCreatorTG" target="_blank">@DurovCreatorTG</a>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        console.log('ВЕРСИЯ 6.0 - 3 ВКЛАДКИ');

        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const prizes = [
            { id: 1, name: 'Розовое сердце', emoji: '💗', cost: 15, chance: 35 },
            { id: 2, name: 'Плюшевый мишка', emoji: '🧸', cost: 15, chance: 35 },
            { id: 3, name: 'Коробка с бантом', emoji: '🎁', cost: 25, chance: 12 },
            { id: 4, name: 'Красная роза', emoji: '🌹', cost: 25, chance: 10 },
            { id: 5, name: 'Праздничный торт', emoji: '🎂', cost: 50, chance: 3 },
            { id: 6, name: 'Букет цветов', emoji: '💐', cost: 50, chance: 2.5 },
            { id: 7, name: 'Ракета', emoji: '🚀', cost: 50, chance: 1.5 },
            { id: 8, name: 'Шампанское', emoji: '🍾', cost: 50, chance: 0.5 },
            { id: 9, name: 'Кубок победителя', emoji: '🏆', cost: 100, chance: 0.2 },
            { id: 10, name: 'Кольцо с бриллиантом', emoji: '💍', cost: 100, chance: 0.2 },
            { id: 11, name: 'Большой алмаз', emoji: '💎', cost: 100, chance: 0.1 }
        ];

        let stars = 25;
        let totalSpins = 0;
        let bestWin = null;
        let isSpinning = false;
        let isDemo = false;
        let timeoutId = null;

        const spinBtn = document.getElementById('spinBtn');
        const demoBtn = document.getElementById('demoBtn');
        const prizeDisplay = document.getElementById('prizeDisplay');
        const prizeDisplayDemo = document.getElementById('prizeDisplayDemo');
        const totalSpinsEl = document.getElementById('totalSpins');
        const bestWinEl = document.getElementById('bestWin');
        const starsDisplay = document.getElementById('starsDisplay');
        const container = document.getElementById('rouletteContainer');
        const containerDemo = document.getElementById('rouletteContainerDemo');

        function getRandomPrize() {
            const rand = Math.random() * 100;
            let cumulative = 0;
            for (const prize of prizes) {
                cumulative += prize.chance;
                if (rand <= cumulative) {
                    return prize;
                }
            }
            return prizes[prizes.length - 1];
        }

        function renderChances() {
            const panel = document.getElementById('chancesPanel');
            panel.innerHTML = prizes.map(p => `
                <div class="chance-row">
                    <span>${p.emoji} ${p.name}</span>
                    <div class="chance-bar">
                        <div class="fill" style="--chance-width: ${p.chance}%;"></div>
                    </div>
                    <span>${p.chance}%</span>
                </div>
            `).join('');
            setTimeout(() => {
                document.querySelectorAll('.chance-bar .fill').forEach(el => {
                    el.classList.add('animated');
                });
            }, 100);
        }

        function showPrize(display, prize, isWin, containerEl) {
            display.innerHTML = `
                <div class="big-emoji spin-anim">${prize.emoji}</div>
                <div class="prize-name">${isWin ? '🎉 ВЫ ВЫИГРАЛИ!' : ''}</div>
                <div class="prize-name" style="font-size:28px;margin-top:5px;">${prize.name}</div>
                <div class="prize-cost">${prize.cost} ⭐</div>
                <div class="prize-chance">Шанс: ${prize.chance}%</div>
            `;

            if (isWin) {
                display.classList.add('winner');
                if (containerEl) {
                    containerEl.style.borderColor = '#ffd700';
                    containerEl.style.boxShadow = '0 0 40px rgba(255,215,0,0.2)';
                }
                for (let i = 0; i < 25; i++) {
                    setTimeout(() => {
                        const el = document.createElement('div');
                        el.className = 'confetti-piece';
                        el.textContent = ['🎉','✨','⭐','🎊','💫','🌟','🌈','🎆'][Math.floor(Math.random()*8)];
                        el.style.left = (10 + Math.random() * 80) + '%';
                        el.style.top = (10 + Math.random() * 30) + '%';
                        el.style.fontSize = (16 + Math.random() * 28) + 'px';
                        document.body.appendChild(el);
                        setTimeout(() => el.remove(), 1500);
                    }, i * 70);
                }
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');
            } else {
                display.classList.remove('winner');
                if (containerEl) {
                    containerEl.style.borderColor = '#3a3a5a';
                    containerEl.style.boxShadow = 'none';
                }
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            }
        }

        function updateStars() {
            starsDisplay.textContent = `⭐ ${stars}`;
            starsDisplay.classList.remove('bump');
            void starsDisplay.offsetWidth;
            starsDisplay.classList.add('bump');
            document.getElementById('profileStars').textContent = stars;
        }

        function spin(isDemoMode) {
            if (isSpinning) return;

            if (!isDemoMode && stars < 25) {
                prizeDisplay.innerHTML = `
                    <div style="color:#ff6b6b;font-size:20px;">❌ Недостаточно звёзд</div>
                    <div style="color:#888;font-size:14px;margin-top:5px;">Нужно 25 ⭐</div>
                `;
                return;
            }

            isSpinning = true;
            spinBtn.disabled = true;
            demoBtn.disabled = true;

            if (!isDemoMode) {
                stars -= 25;
                updateStars();
            }

            const display = isDemoMode ? prizeDisplayDemo : prizeDisplay;
            const containerEl = isDemoMode ? containerDemo : container;

            let count = 0;
            const maxCount = 10 + Math.floor(Math.random() * 5);
            
            if (timeoutId) clearInterval(timeoutId);
            
            const intervalId = setInterval(() => {
                const randomPrize = prizes[Math.floor(Math.random() * prizes.length)];
                display.innerHTML = `
                    <div class="big-emoji" style="font-size:80px;">${randomPrize.emoji}</div>
                    <div style="color:#666;font-size:14px;margin-top:10px;">🎰</div>
                `;
                count++;
                if (count >= maxCount) {
                    clearInterval(intervalId);
                    
                    const prize = getRandomPrize();
                    const isWin = prize.cost > 25;
                    showPrize(display, prize, isWin, containerEl);

                    if (!isDemoMode) {
                        totalSpins++;
                        totalSpinsEl.textContent = totalSpins;
                        document.getElementById('profileSpins').textContent = totalSpins;

                        if (!bestWin || prize.cost > bestWin.cost) {
                            bestWin = prize;
                            bestWinEl.textContent = `${prize.emoji} ${prize.cost}⭐`;
                            document.getElementById('profileBest').textContent = `${prize.emoji} ${prize.cost}⭐`;
                        }
                    }

                    isSpinning = false;
                    spinBtn.disabled = false;
                    demoBtn.disabled = false;

                    if (!isDemoMode && stars < 25) {
                        spinBtn.textContent = '😅 Нет звёзд';
                    } else {
                        spinBtn.textContent = isDemoMode ? '🎮 ДЕМО КРУТКА' : `🎰 КРУТИТЬ (25 ⭐)`;
                    }
                }
            }, 100);
        }

        renderChances();

        spinBtn.addEventListener('click', () => {
            spin(false);
        });

        demoBtn.addEventListener('click', () => {
            spin(true);
        });

        document.getElementById('chancesToggle').addEventListener('click', () => {
            const panel = document.getElementById('chancesPanel');
            panel.classList.toggle('show');
            document.getElementById('chancesToggle').textContent = 
                panel.classList.contains('show') ? '📊 Скрыть' : '📊 Шансы';
        });

        // НАВИГАЦИЯ
        document.querySelectorAll('.nav-item').forEach((item) => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                item.classList.add('active');
                
                const pageId = item.dataset.page;
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                document.getElementById(pageId).classList.add('active');
            });
        });

        starsDisplay.textContent = `⭐ ${stars}`;
        document.getElementById('profileStars').textContent = stars;
        document.getElementById('profileSpins').textContent = '0';
        document.getElementById('profileBest').textContent = '-';
    </script>
</body>
</html>
